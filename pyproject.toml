[project]
name = "lost-found"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asgiref==3.12.1",
    "crispy-bootstrap5==2026.9",
    "Django==6.1.1",
    "django-crispy-forms==2.7",
    "pillow==12.3.0",
    "sqlparse==0.6.0",
    "tzdata==2026.3",
    "whitenoise==6.11.0",
    "dj-database-url==2.3.0",
    "psycopg[binary]==3.2.10",
]

[tool.vercel.scripts]
build = 'if [ -n "$DATABASE_URL" ]; then python manage.py migrate --noinput; fi'
