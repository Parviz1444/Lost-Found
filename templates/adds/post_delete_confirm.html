{% extends "base.html" %}

{% block title %}Delete post{% endblock %}

{% block content %}
<h1>Delete post</h1>
<p>Are you sure you want to delete?</p>
<h5 class="fw-lighter my-3"><b class="text-danger">{{ post.title }}</b></h5>
<form method="post">
 {% csrf_token %}
 <p>
     <button class="btn btn-danger" type="submit">Yes, delete</button>
    <a class="btn btn-dark" href="{% url 'post_detail' post.slug %}">No, go back</a></p>
</form>
{% endblock %}
